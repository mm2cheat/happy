<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Chung Sức Liên Quân</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }
        textarea, input[type="number"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        textarea:focus, input:focus {
            border-color: #007bff;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #999;
            cursor: not-allowed;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
            word-wrap: break-word;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .note {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 Tool Chung Sức</h2>
    
    <div class="form-group">
        <label for="apiKey">API Key (Token):</label>
        <!-- Thêm ô nhập API Key để bảo mật, không bị lộ khi đưa lên Github -->
        <input type="password" id="apiKey" placeholder="Nhập mã dvc_... của bạn vào đây">
        <span class="note">Mã này sẽ không bị lưu lại, an toàn khi dùng.</span>
    </div>

    <div class="form-group">
        <label for="inviteText">Dán đoạn text copy từ game:</label>
        <textarea id="inviteText" placeholder="VD: Chia sẻ mã mời --XXXXXXXXXX--, [[llxHQdf... ]]"></textarea>
    </div>

    <div class="form-group">
        <label for="quantity">Số lượng cần chạy:</label>
        <input type="number" id="quantity" value="1" min="1">
    </div>

    <button id="submitBtn" onclick="processOrder()">Tạo Đơn Ngay</button>

    <div id="result"></div>
</div>

<script>
    const API_URL = "https://api.dichvuchungsuc.com/v1/orders";

    async function processOrder() {
        const apiKey = document.getElementById("apiKey").value.trim();
        const inviteText = document.getElementById("inviteText").value.trim();
        const quantity = document.getElementById("quantity").value;
        const resultBox = document.getElementById("result");
        const submitBtn = document.getElementById("submitBtn");

        resultBox.style.display = "none";
        resultBox.className = "";
        resultBox.innerHTML = "";

        if (!apiKey) {
            showResult("Vui lòng nhập API Key!", "error");
            return;
        }

        if (!inviteText) {
            showResult("Vui lòng dán đoạn text mã mời từ game!", "error");
            return;
        }

        // Tách lấy mã Code (XXXXXXXXXX)
        const match = inviteText.match(/--([A-Za-z0-9]+)--/);
        if (!match) {
            showResult("Không tìm thấy mã hợp lệ! Hãy dán đúng nguyên văn text copy từ game.", "error");
            return;
        }

        const extractedCode = match[1];

        // Dữ liệu body chuẩn theo cURL
        const bodyData = {
            serviceCode: "LIENQUAN_CHUNG_SUC",
            quantity: parseInt(quantity),
            lienQuanCode: extractedCode // Chữ Q viết hoa theo chuẩn API
        };

        // Tạo Idempotency-Key tự động dựa trên thời gian để không bị trùng đơn
        const idempotencyKey = "shop-order-" + Date.now();

        // Header chuẩn theo cURL
        const headers = {
            "accept": "*/*",
            "Idempotency-Key": idempotencyKey,
            "Authorization": `Bearer ${apiKey}`,
            "Content-Type": "application/json"
        };

        submitBtn.disabled = true;
        submitBtn.innerText = "Đang xử lý...";

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: headers,
                body: JSON.stringify(bodyData)
            });

            const data = await response.json();

            if (response.ok || response.status === 200 || response.status === 201) {
                showResult(`✅ Đã tạo đơn thành công!<br>Mã code: <b>${extractedCode}</b><br>Số lượng: ${quantity}`, "success");
                document.getElementById("inviteText").value = ""; 
            } else {
                showResult(`❌ Lỗi API: ${JSON.stringify(data)}`, "error");
            }
        } catch (error) {
            showResult(`❌ Lỗi kết nối mạng: Không thể kết nối tới server.`, "error");
            console.error("Lỗi:", error);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "Tạo Đơn Ngay";
        }
    }

    function showResult(message, type) {
        const resultBox = document.getElementById("result");
        resultBox.innerHTML = message;
        resultBox.className = type;
        resultBox.style.display = "block";
    }
</script>

</body>
</html>
